<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-UI</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
<div class="logIN">
    <!-- Main Heading and Paragraph -->
    <div class="heading">
        <div class="main-heading">
            <h2>Create Account</h2>
        </div>

        <div class="prea">
            <p>Create a new account to get started and enjoy seamless access to our features</p>
        </div>
    </div>

    <!-- Input -->
    <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" placeholder="enter your username" required>
    </div>

    <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input type="text" placeholder="enter your email  address" required>
    </div>

    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="enter password" id="password" required>
        <i class="fa-solid fa-eye toggle-password" id="togglepassword"></i>
    </div>

    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="confrim your password" id="password" required>
        <i class="fa-solid fa-eye toggle-password" id="togglepassword"></i>
    </div>

    <!-- Create Acount Button -->
    <div class="btn">
        <button type="submit" class="sumbit-btn">Create Account</button>
    </div>

<div class="signIn-section">
Already have an account ? <a href="login.html">Sign In Here</a>

</div>

    
</div>
</div>

</body>

</html>
