<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>

    <style>
        /* Element selectors */

        /* div{
            background-color: red;
        } */

        /* Class selectors */

        .red {
            background-color: red;
        }


        /* ID selectors */
        #green {
            background-color: green;
        }

        /* Child selectors */

        div>p {
            color: rgb(239, 248, 248);
            background-color: black;
        }

        /* Descendant selector */

        div p {
            color: rgb(239, 248, 248);
            background-color: black;
        }

        /* Universal selector */

        * {
            margin: 0;
            padding: 0;
        }

        /* Pseudo selector */
        a:visited {
            color: rgb(217, 224, 13);
        }

        a:link {
            color: green;
        }

        a:hover {
            background-color: aqua;
        }

        p:first-child {
            background-color: blue;
        }
    </style>


</head>

<body>

    <main class="one">
        <p>I am first</p>
        <p>Iam second</p>

    </main>


    <div class="red">
        I am div
        <main>
            <p>Hello everyone Iam Nikhil Gupta</p>
        </main>
    </div>

    <div id="green">
        I am anothor div

    </div>

    <a href="https://www.google.com">Go to Google</a> <br>
    <a href="https://www.facebook.com">Go to Facebook</a>

</body>

</html>
